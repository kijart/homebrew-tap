name: Audit

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Style and audit casks
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tap the checkout
        run: |
          brew update
          tap="$(brew --repository)/Library/Taps/kijart/homebrew-tap"
          mkdir -p "$(dirname "$tap")"
          ln -s "$GITHUB_WORKSPACE" "$tap"
          brew trust kijart/tap

      - name: Style
        run: brew style kijart/tap

      - name: Audit
        run: brew audit --cask --strict --online --tap kijart/tap
